<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plumbline</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>Plumbline</h1>
      <p class="tagline">Know why the next diagram comes next.</p>
    </header>
    <main>
      <section>
        <h2 id="model-name"></h2>
        <table id="requirements">
          <thead><tr><th>ID</th><th>Requirement</th><th>Satisfied by</th><th>Verified by</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
      <section>
        <h2>Checks</h2>
        <ul id="findings"></ul>
      </section>
      <section class="file-actions">
        <button id="export">Export model file</button>
        <label class="button">Import model file <input id="import" type="file" accept=".json" hidden /></label>
        <button id="reset">Reset to example</button>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
